name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Matches gradle/wrapper/gradle-wrapper.properties — no gradlew is
          # checked into this repo, so we install Gradle directly instead of
          # relying on a wrapper script.
          gradle-version: '8.4'

      - name: Build debug APK
        working-directory: TyceptApp
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tycept-debug-apk
          path: TyceptApp/app/build/outputs/apk/debug/*.apk
