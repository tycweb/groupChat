apply plugin: 'com.android.application'

android {
    namespace 'com.example.tycept'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.tycept"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }
}

dependencies {
    implementation('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json'
    }
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Media3 ExoPlayer replaces the old android.widget.VideoView + MediaController.
    // VideoView is deprecated, doesn't reliably keep its native aspect ratio, and
    // its default MediaController is the unstyled black/orange Holo widget — all
    // three of those are exactly the bugs this migration fixes.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
}
